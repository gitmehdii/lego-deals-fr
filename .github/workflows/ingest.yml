name: ingest

# This file calls the CLI and does nothing else. No step reads a GITHUB_*
# variable, no step emits ::notice::, and nothing under src/ knows this file
# exists. Moving to a VPS means changing the trigger and nothing more.

on:
  schedule:
    # Asks for every 15 minutes and gets one run every 104, measured over six
    # days and 85 triggers: GitHub queues scheduled workflows rather than
    # guaranteeing them, and honours about 14% of the slots — worse at night
    # (131 min between runs) than by day (93).
    #
    # Left at */15 deliberately. Asking more often yields more runs than asking
    # less, so lowering this to */30 would not make the file more truthful, it
    # would halve what we get. The README carries the measured numbers.
    #
    # GitHub also disables scheduled workflows entirely in a repository nobody
    # has touched for 60 days — which is why the pipeline warns about its own
    # silence in Discord rather than trusting this line.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# DATABASE_URL must point at Turso. A runner's disk is wiped between runs, so
# an on-disk SQLite would start empty every time and price_points — the one
# table nobody could rebuild — would never accumulate.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A GitHub secret is not an environment variable until it is named here.
    # A channel missing from this list is not an error anywhere: config falls
    # back to DISCORD_WEBHOOK_URL by design, so its deals land in the catch-all
    # while alerts.channel_id keeps recording the room they were meant for.
    # tests/test_workflows.py compares this block to the Settings fields.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEALABS_RSS_URL: ${{ secrets.DEALABS_RSS_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_WEBHOOK_STAR_WARS: ${{ secrets.DISCORD_WEBHOOK_STAR_WARS }}
      DISCORD_WEBHOOK_COLLECTION: ${{ secrets.DISCORD_WEBHOOK_COLLECTION }}
      DISCORD_WEBHOOK_VEHICULES: ${{ secrets.DISCORD_WEBHOOK_VEHICULES }}
      DISCORD_WEBHOOK_UNIVERS: ${{ secrets.DISCORD_WEBHOOK_UNIVERS }}
      DISCORD_WEBHOOK_DIVERS: ${{ secrets.DISCORD_WEBHOOK_DIVERS }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      # Safe every time: Alembic stops at the first revision already applied.
      - run: uv run alembic upgrade head

      - run: uv run python -m bricks.ingest --source dealabs
