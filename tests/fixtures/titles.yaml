# Jeu de test de la résolution — le filet de sécurité du projet.
#
# À enrichir CHAQUE FOIS qu'une résolution rate. Un titre qui a piégé le
# résolveur une fois le piégera à nouveau.
#
# Deux sections, séparées volontairement :
#
#   real        Titres copiés tels quels depuis le flux LEGO de Dealabs, via
#               offers.title_raw. C'est eux que compte le critère « au moins
#               50 titres réels » de TICKETS.md.
#
#   spec_traps  Cas construits à la main, dérivés des pièges nommés dans
#               SPEC.md § 3. Synthétiques et comptés à part, pour que le
#               décompte des titres réels reste honnête.
#
# `set_num: null` signifie « aucune résolution ne doit être acceptée ». C'est
# une réponse attendue, pas un échec : un lot de plusieurs sets ou un produit
# qui n'est pas un set LEGO n'a pas de bonne réponse unique.
#
# ⚠️  Les étiquettes de `real` ont été PROPOSÉES automatiquement puis relues,
#     elles n'ont pas encore été validées par un humain. Tant que ce n'est pas
#     fait, ce fichier mesure la cohérence du résolveur avec lui-même autant
#     que sa justesse.
#
#     Elles ne sont pas devinées pour autant : chaque numéro lu dans un titre
#     est croisé avec le catalogue, et le nom officiel anglais doit correspondre
#     au titre français. Un titre dont plusieurs numéros existent au catalogue
#     n'entre pas ici sans décision explicite.

