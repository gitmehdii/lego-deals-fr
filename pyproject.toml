[project]
name = "bricks"
version = "0.1.0"
description = "Détecte les promos sur les sets LEGO en France et les publie dans Discord"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bricks"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "ANN",
    "DTZ",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"src/bricks/db/migrations/*" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["bricks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
